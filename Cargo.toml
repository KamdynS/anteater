[workspace]
resolver = "2"
members = [
    "crates/anteater-ui-types",
    "crates/anteater-ui",
    "crates/anteater-engine",
    "crates/anteater-core",
    "crates/anteater",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourusername/anteater"

[workspace.dependencies]
# UI dependencies
egui = { version = "0.29", features = ["default"] }
eframe = { version = "0.29", default-features = true }
egui_dock = "0.14"
egui_plot = "0.29"
syntect = "5.2"
plist = "1.8"
serde = { version = "1.0", features = ["derive"] }

# Shared types
anteater-ui-types = { path = "crates/anteater-ui-types" }
anteater-ui = { path = "crates/anteater-ui" }
anteater-engine = { path = "crates/anteater-engine" }
anteater-core = { path = "crates/anteater-core" }
